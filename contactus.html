<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bamba - კალათა</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">Bamba 🍔</a>
      <button class="burger" id="burgerBtn">☰</button>
      <nav id="navMenu">
        <a href="index.html">მთავარი</a>
        <a href="menu.html">მენიუ</a>
        <a href="cart.html" class="active">კალათა (<span id="cartCount">0</span>)</a>
        <a href="favorite.html">ფავორიტები (<span id="favCount">0</span>)</a>
        <a href="contactus.html">კონტაქტი</a>
      </nav>
      <button id="themeToggle" class="theme-btn">🌙</button>
    </div>
  </header>

  <main class="container">
    <h2 style="margin-bottom:20px;">შენი კალათა 🛒</h2>
    <div id="bcart"></div>
    
    <div style="background:var(--bg-card); padding:20px; border-radius:12px; border:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; margin-top:20px;">
      <h3>სულ: <span id="btotal" style="color:var(--primary);">0.00</span> ₾</h3>
      <button class="btn-main" style="width:auto; padding:10px 20px;" onclick="alert('შეკვეთა მიღებულია!')">შეკვეთა</button>
    </div>
  </main>

  <script src="bamba-data.js"></script>
  <script src="bamba.js"></script>
</body>
</html>
